# Build, test and package MimicCam on every push to main.
#
# A v* tag additionally attaches the portable zip to that tag's GitHub release,
# so cutting a release is: bump the version, commit, `git tag v0.1.2`, push the
# tag.
#
# The runner has no GPU, no webcam and no OBS virtual camera. The unit tests
# need none of those, and build.py's smoke test reports the missing DirectShow
# camera as a skip rather than a failure while still failing if the frozen exe
# cannot load pyvirtualcam at all.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Check imports
        # Importing the package must not need a camera, a key or a display.
        run: python -c "import mimiccam, mimiccam.decart_engine, mimiccam.pipeline, mimiccam.ui; print('imports ok')"

      - name: Build portable exe
        run: python build.py

      - name: Checksums
        run: |
          cd dist
          sha256sum MimicCam-*-portable.zip > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MimicCam-windows-x64
          path: |
            dist/MimicCam-*-portable.zip
            dist/SHASUMS256.txt
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MimicCam-*-portable.zip
            dist/SHASUMS256.txt
          generate_release_notes: true
